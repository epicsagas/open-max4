<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>open-max4</title>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
  <style>
    :root {
      color-scheme: light;
      --gray: #c0c0c0;
      --dk: #404040;
      --mid: #808080;
      --lt: #dfdfdf;
      --navy: #000080;
      --teal: #008080;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 12px;
      background: radial-gradient(1100px 700px at 50% 28%, #2b3036, #0f1113 75%);
      font-family: "MS Sans Serif", "Microsoft Sans Serif", Tahoma, Verdana, sans-serif;
      font-size: 13px;
      color: #000;
    }
    button, input, label, small { font: inherit; }

    /* ---- CRT monitor ---- */
    .monitor {
      position: relative;
      width: min(96vw, 980px);
      padding: 22px 22px 40px;
      border-radius: 26px 26px 16px 16px;
      background: linear-gradient(180deg, #ddd8cb 0%, #c2bcae 55%, #9d968a 100%);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.55),
        inset 0 -3px 0 rgba(0,0,0,.28),
        inset 2px 0 0 rgba(255,255,255,.18),
        0 30px 70px rgba(0,0,0,.6);
    }
    .brand {
      position: absolute; bottom: 13px; left: 28px;
      font-size: 11px; font-weight: bold; letter-spacing: .18em; color: #6c655a;
    }
    .model {
      position: absolute; bottom: 13px; right: 42px;
      font-size: 11px; letter-spacing: .08em; color: #6c655a;
    }
    .led {
      position: absolute; bottom: 11px; right: 26px;
      width: 9px; height: 9px; border-radius: 50%;
      background: #41ff61;
      box-shadow: 0 0 8px #41ff61, inset 0 -1px 1px rgba(0,0,0,.4);
    }
    .crt {
      position: relative;
      display: flex;
      height: min(76vh, 660px);
      min-height: 430px;
      border-radius: 16px;
      overflow: hidden;
      background:
        conic-gradient(rgba(0,0,0,.10) 25%, transparent 0 50%, rgba(0,0,0,.10) 0 75%, transparent 0) 0 0 / 2px 2px,
        var(--teal);
      box-shadow: inset 0 0 0 3px #050505;
    }
    .crt::before { /* scanlines */
      content: ""; position: absolute; inset: 0; z-index: 6; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
    }
    .crt::after { /* vignette + glass reflection */
      content: ""; position: absolute; inset: 0; z-index: 7; pointer-events: none;
      border-radius: inherit;
      background:
        radial-gradient(120% 90% at 50% 42%, transparent 58%, rgba(0,0,0,.34) 100%),
        linear-gradient(115deg, rgba(255,255,255,.07) 0%, transparent 22%);
      box-shadow: inset 0 0 70px rgba(0,0,0,.5);
    }

    /* ---- Windows 3.1 window ---- */
    #app {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      margin: 18px 18px 14px;
      background: var(--gray);
      border: 2px solid;
      border-color: #fff var(--dk) var(--dk) #fff;
      box-shadow: inset 1px 1px 0 var(--lt), inset -1px -1px 0 var(--mid), 1px 1px 0 #000;
    }
    .titlebar {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 4px;
      background: var(--navy);
      color: #fff;
    }
    .titlebar h1, .titlebar h2 {
      flex: 1; margin: 0;
      font-size: 12px; font-weight: bold;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sysmenu {
      width: 18px; height: 16px; flex: none;
      background: var(--gray);
      border: 1px solid;
      border-color: #fff #000 #000 #fff;
      position: relative;
    }
    .sysmenu::after {
      content: ""; position: absolute; left: 3px; right: 3px; bottom: 4px;
      border-top: 2px solid #000;
    }
    .cap b {
      width: 18px; height: 16px;
      display: inline-grid; place-items: center;
      background: var(--gray); color: #000;
      font-size: 9px; line-height: 1; font-weight: 400;
      border: 1px solid;
      border-color: #fff #000 #000 #fff;
      margin-left: 2px;
    }
    .toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 6px;
      border-bottom: 1px solid var(--mid);
      box-shadow: 0 1px 0 #fff;
    }
    .chk { display: flex; align-items: center; gap: 4px; user-select: none; }
    .sep { width: 1px; align-self: stretch; background: var(--mid); box-shadow: 1px 0 0 #fff; }

    button {
      cursor: pointer;
      background: var(--gray);
      color: #000;
      border: 2px solid;
      border-color: #fff var(--dk) var(--dk) #fff;
      box-shadow: 1px 1px 0 #000;
      padding: 2px 12px;
      min-width: 64px;
    }
    button:active {
      border-color: var(--dk) #fff #fff var(--dk);
      box-shadow: none;
      padding: 3px 11px 1px 13px;
    }
    button:focus-visible, input:focus-visible { outline: 1px dotted #000; outline-offset: -4px; }

    /* ---- chat screen ---- */
    .screen {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      margin: 6px;
      border: 2px solid;
      border-color: var(--dk) #fff #fff var(--dk);
      background: #000;
    }
    #messages {
      flex: 1; min-height: 0;
      overflow-y: auto;
      padding: 12px 14px;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      line-height: 1.6;
      text-shadow: 0 0 4px rgba(140,230,255,.28);
    }
    .line { margin: 0 0 12px; white-space: pre-wrap; }
    .user { color: #ffdf55; }
    .max { background: #0000aa; color: #fff; padding: 8px 10px; }
    .ai { background: #155f36; color: #eafff2; padding: 8px 10px; }
    #chat-form {
      display: flex; gap: 6px;
      padding: 8px;
      border-top: 2px solid var(--mid);
      background: var(--gray);
    }
    #input {
      flex: 1; min-width: 0;
      background: #fff; color: #000;
      border: 2px solid;
      border-color: var(--dk) #fff #fff var(--dk);
      font-family: "Courier New", monospace;
      font-size: 14px;
      padding: 3px 6px;
    }
    .statusbar { display: flex; gap: 4px; padding: 0 6px 6px; }
    .statusbar div {
      padding: 2px 10px; font-size: 11px;
      border: 1px solid;
      border-color: var(--dk) #fff #fff var(--dk);
    }
    .statusbar div:first-child { flex: 1; }

    /* ---- BYOK dialog ---- */
    dialog {
      border: 2px solid;
      border-color: #fff var(--dk) var(--dk) #fff;
      box-shadow: 1px 1px 0 #000, 0 18px 50px rgba(0,0,0,.5);
      background: var(--gray);
      color: #000;
      padding: 0;
      width: min(92vw, 420px);
    }
    dialog::backdrop { background: rgba(0,0,0,.45); }
    #settings-form { display: flex; flex-direction: column; }
    #settings-form .titlebar { margin: 3px; }
    .dlg-body { display: grid; gap: 10px; padding: 12px 14px; }
    .dlg-body label { display: grid; gap: 3px; font-size: 12px; }
    .dlg-body input, .dlg-body select {
      background: #fff; color: #000;
      padding: 3px 6px;
      border: 2px solid;
      border-color: var(--dk) #fff #fff var(--dk);
      font-size: 13px;
    }
    .dlg-body small { color: #222; font-size: 11px; }
    .dlg-buttons { display: flex; gap: 8px; justify-content: center; padding: 0 14px 14px; }

    /* ---- legacy DOS mode ---- */
    #dos { display: none; flex: 1; }
    body.legacy #app { display: none; }
    body.legacy #dos { display: block; }
    #back { position: absolute; top: 14px; right: 14px; z-index: 20; display: none; }
    body.legacy #back { display: inline-block; }

    @media (max-width: 640px) {
      body { padding: 8px 4px; }
      .monitor { padding: 10px 10px 28px; border-radius: 16px 16px 10px 10px; }
      .crt { height: 74vh; }
      #app { margin: 8px; }
    }
  </style>
</head>
<body>
  <div class="monitor">
    <div class="crt">
      <main id="app">
        <header>
          <div class="titlebar">
            <span class="sysmenu" aria-hidden="true"></span>
            <h1>open-max4</h1>
            <span class="cap" aria-hidden="true"><b>▾</b><b>▴</b></span>
          </div>
          <div class="toolbar">
            <label class="chk"><input id="byok-enabled" type="checkbox"> BYOK</label>
            <span class="sep" aria-hidden="true"></span>
            <button id="settings" type="button">BYOK 설정</button>
            <button id="legacy" type="button">원본 DOS</button>
          </div>
        </header>
        <section class="screen" aria-label="MAX 대화 화면">
          <div id="messages" aria-live="polite"></div>
          <form id="chat-form">
            <input id="input" autocomplete="off" placeholder="할 말을 입력하세요" aria-label="대화 입력">
            <button>보내기</button>
          </form>
        </section>
        <footer class="statusbar">
          <div id="status" aria-live="polite">원본 엔진</div>
          <div>비공식 복원판</div>
        </footer>
      </main>
      <button id="back" type="button">현대판으로</button>
      <div id="dos"></div>
    </div>
    <span class="brand" aria-hidden="true">MAX</span>
    <span class="model" aria-hidden="true">CRT-1994</span>
    <span class="led" aria-hidden="true"></span>
  </div>
  <dialog id="settings-dialog">
    <form id="settings-form" method="dialog">
      <div class="titlebar">
        <span class="sysmenu" aria-hidden="true"></span>
        <h2>OpenAI 호환 BYOK</h2>
      </div>
      <div class="dlg-body">
        <label>엔드포인트 <input id="endpoint" value="https://api.openai.com/v1" required></label>
        <label>모델 <input id="model" placeholder="gpt-4.1-mini" required></label>
        <label>모드 <select id="persona">
          <option value="standard">표준 — 맥스 말투만</option>
          <option value="1994">고증 1994 — 원본 출시 시점</option>
          <option value="1997">고증 1997 — IMF 직전</option>
          <option value="1999">고증 1999 — 세기말</option>
        </select></label>
        <label>API 키 <input id="api-key" type="password" autocomplete="off" required></label>
        <small>키는 이 탭의 sessionStorage에 저장되어 탭을 닫으면 지워집니다. 단 탭 복원(Cmd+Shift+T)이나 세션 복구로 되살아날 수 있으니, 확실히 지우려면 <b>키 지우기</b>를 누르세요. 엔드포인트·모델은 이 브라우저에 계속 남습니다.</small>
      </div>
      <div class="dlg-buttons"><button>이 설정으로 사용</button><button id="forget" type="button">키 지우기</button></div>
    </form>
  </dialog>
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <script type="module" src="app/main.js"></script>
</body>
</html>
