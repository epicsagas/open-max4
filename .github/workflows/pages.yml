# 원본 데이터 없이 BYOK 전용으로 동작하는 빌드를 GitHub Pages에 올린다.
# 수동 실행만 한다. Settings > Pages 에서 Source를 GitHub Actions로 바꾼 뒤 돌릴 것.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # build:pages 는 원본 사본이 들어가는 dist/local 을 지운다.
      - run: npm run build:pages
      - name: 원본이 산출물에 없는지 확인
        run: |
          if [ -e dist/local ]; then
            echo "dist/local 이 남아 있다. 배포 중단." >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
